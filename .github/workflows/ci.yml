name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Python ${{ matrix.python-version }} на ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ["3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Зависимости
        run: python -m pip install -r requirements.txt
      - name: Тесты
        env:
          AMADEUS_ALLOW_PLAINTEXT_DB: "1"
          AMADEUS_SECRET_STORE: memory
          AMADEUS_ALLOW_USER_OVERRIDE: "1"
        run: python -m pytest -q

  frontend:
    name: Сборка UI на ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Зависимости
        run: npm ci
      - name: Типы и сборка
        run: npm run build

  windows-native:
    name: Нативная сборка Windows (Tauri + NSIS)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Зависимости ядра
        working-directory: backend
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Собрать сайдкар ядра
        working-directory: backend
        run: python packaging/build_sidecar.py
      - name: Зависимости UI
        run: npm ci
      - name: Сборка UI
        run: npm run build
      - name: Проверка Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Сборка установщика NSIS
        run: npx tauri build --bundles nsis
      - name: Загрузить установщик
        uses: actions/upload-artifact@v7
        with:
          name: amadeus-windows-installer
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  signing:
    name: Подпись через SignPath (open source)
    if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
    needs: [backend, frontend]
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Зависимости ядра и UI
        working-directory: backend
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Собрать сайдкар ядра
        working-directory: backend
        run: python packaging/build_sidecar.py
      - name: Зависимости UI
        working-directory: app
        run: npm ci
      - name: Релизная сборка Tauri
        working-directory: app
        run: npx tauri build --no-bundle
      - name: Загрузка неподписанного артефакта
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: amadeus-unsigned
          path: app/src-tauri/target/release/Amadeus.exe
          if-no-files-found: error
      - name: Запрос подписи SignPath
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Проверка подписи
        run: |
          $exe = Get-ChildItem signed -Filter *.exe -Recurse | Select-Object -First 1
          & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\signtool.exe" verify /pa /v $exe.FullName
      - name: Загрузка подписанного артефакта
        uses: actions/upload-artifact@v7
        with:
          name: amadeus-signed
          path: signed
